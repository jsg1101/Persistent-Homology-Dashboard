 <!-- =====================================================
      FILE SUMMARY PANEL (hidden until file is loaded)
    ====================================================== -->
    <div id="fileSummary" class="card hidden">

        <!-- TOP ROW -->
        <div class="summary-top">

            <!-- COLUMN 1 -->
            <div class="summary-col title-col">
            <h2 class="summary-title">File Summary:</h2>
            </div>

            <!-- COLUMN 2 -->
            <div class="summary-col">
                <span>Name: <b id="fileName">0</b></span>
                <span>Size: <b id="fileSize">0</b></span>
            </div>

            <!-- COLUMN 3 -->
            <div class="summary-col">
                <span>Rows: <b id="rowCount">0</b></span>
                <span>Cols: <b id="colCount">0</b></span>
            </div>

        </div>

        <!-- Data quality overview -->
        <div class="issues-panel">

            <div class="issue-box total">
                <h2 id="totalIssues">0</h2>
                <p>Total Issues</p>
            </div>

            <div class="issue-box missing">
                <h2 id="missingCount">0</h2>
                <p>Missing</p>
            </div>

            <div class="issue-box invalid">
                <h2 id="invalidCount">0</h2>
                <p>Invalid</p>
            </div>

        </div>
      
    </div>
