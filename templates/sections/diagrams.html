

<link rel="stylesheet" href="{{ url_for('static', filename='CSS/diagrams.css') }}">

<div class="page" id="diagrams-page">

  <!-- File Summary -->
  {% include 'sections/components/file_summary.html' %}


  <!-- Diagram Options -->
  
  <div  class="card hidden">

    <!-- TOP ROW -->
    <div class="options-top">

        <!-- COLUMN 1 -->
        <div class="options-col title-col">
        <h2 class="options-title">Options</h2>
        </div>

        <!-- COLUMN 2 -->
        <div class="options-col">
          <label for="dimension"><b>Dimension</b></label><br>

            <label >
              <input type="radio" name="dimension_diagram" value="0" >
                H<sub>0</sub>
            </label>
        
            <label >
              <input type="radio" name="dimension_diagram" value="1" checked>
              H<sub>0</sub> and H<sub>1</sub>
            </label>
        
            <label >
              <input type="radio" name="dimension_diagram" value="2">
              H<sub>0</sub>, H<sub>1</sub>, and H<sub>2</sub> 
            </label>

        </div>

        <!-- COLUMN 3 -->
        <div class="options-col">
          <label for="metric"><b>Metric</b></label><br>

            <label >
              <input type="radio" name="metric_diagram" value="0" checked>
                Euclidean
            </label>
        
            <label >
              <input type="radio" name="metric_diagram" value="1">
                Cosine
            </label>
        
            <label >
              <input type="radio" name="metric_diagram" value="2">
                Manhattan 
            </label>
        </div>

        <!-- COLUMN 4 -->
        <div class="options-col">
          <label for="Coeff"><b>Coefficients in Z/pZ</b></label>

        
          <div class="input-row">
            <span>p = </span>
            <input
                type="number"
                id="prime_diagram"
                name="prime_diagram"
                min="2"
                step="1"
                value="2"
            >
          </div>
        </div>

    </div>

    <!-- Data quality overview -->
    <!-- Button -->
    <div class = "diagramBtn_container">
      <button id ="diagramBtn">
        Compute Diagram
      </button>
  </div>
  
</div>

  
  <!-- Diagram Options -->
  

  <!-- Diagram -->
  <div id="diagram-container" class="card hidden">
      <img id="diagram-image" />
  </div>

  

</div>
