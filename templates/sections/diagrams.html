

<link rel="stylesheet" href="{{ url_for('static', filename='CSS/diagrams.css') }}">

<div class="page" id="diagrams-page">

  <!-- File Summary -->
  {% include 'sections/components/file_summary.html' %}


  <!-- Diagram Options -->
  <!-- <div id="fileSummary" class="card hidden"> -->
  <div  class="card hidden">

    <!-- TOP ROW -->
    <div class="options-top">

        <!-- COLUMN 1 -->
        <div class="options-col title-col">
        <h2 class="options-title">Options</h2>
        </div>

        <!-- COLUMN 2 -->
        <div class="options-col">
          <label for="dimension"><b>Dimension</b></label><br>

            <label >
              <input type="checkbox" name="dim" value="0" checked>
                H<sub>0</sub></span>
            </label>
        
            <label >
              <input type="checkbox" name="dim" value="1" checked>
                H<sub>1</sub>
            </label>
        
            <label >
              <input type="checkbox" name="dim" value="2">
                H<sub>2</sub> 
            </label>

        </div>

        <!-- COLUMN 3 -->
        <div class="options-col">
          <label for="dimension"><b>Metric</b></label><br>

            <label >
              <input type="radio" name="metric" value="0" checked>
                Euclidean
            </label>
        
            <label >
              <input type="radio" name="metric" value="1">
                Cosine
            </label>
        
            <label >
              <input type="radio" name="metric" value="2">
                Manhattan 
            </label>
        </div>

        <!-- COLUMN 4 -->
        <div class="options-col">
          <label for="Coeff"><b>Coefficients Z/pZ</b></label><br>

            <label >
              <input type="radio" name="Coeff" value="0">
                H<sub>0</sub></span>
            </label>
        
            <label >
              <input type="radio" name="Coeff" value="1">
                H<sub>0</sub> and H<sub>1</sub>
            </label>
        
            <label >
              <input type="radio" name="Coeff" value="2" checked>
                H<sub>0</sub>, H<sub>1</sub>, and H<sub>2</sub> 
            </label>
        </div>

    </div>

    <!-- Data quality overview -->
    <!-- Button -->
    <div class = "diagramBtn_container">
      <button id ="diagramBtn">
        Compute Diagram
      </button>
  </div>
  
</div>

  
  <!-- Diagram Options -->
  

  <!-- Diagram -->
  <div id="diagram-container" class="card hidden">
      <img id="diagram-image" />
  </div>

  

</div>
